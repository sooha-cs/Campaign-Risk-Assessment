<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Input | ProjectRisk AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="index">
<div id="nav-root"></div>
<main class="container pb-4">

<div class="page-head">
  <h1>Describe your project</h1>
  <p>Enter the plan and we will build a schedule, score the risks and suggest how to handle each one.</p>
</div>

<div id="msg" aria-live="polite"></div>

<form id="projectForm" class="panel" novalidate>
<fieldset id="fields">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label" for="name">Project name</label>
      <input class="form-control" id="name" name="name" required placeholder="Website redesign"></div>
    <div class="col-md-6"><label class="form-label" for="budget">Total budget (INR)</label>
      <input type="number" min="0" class="form-control" id="budget" name="budget" required></div>
    <div class="col-md-4"><label class="form-label" for="startDate">Start date</label>
      <input type="date" class="form-control" id="startDate" name="startDate" required></div>
    <div class="col-md-4"><label class="form-label" for="deadline">Deadline</label>
      <input type="date" class="form-control" id="deadline" name="deadline" required></div>
    <div class="col-md-4"><label class="form-label" for="teamSize">Team size</label>
      <input type="number" min="1" class="form-control" id="teamSize" name="teamSize" required></div>

    <div class="col-12">
      <h2 class="h5 mt-2">Resources</h2>
      <div class="row g-2 small text-secondary d-none d-md-flex mb-1">
        <div class="col-md-5">Role</div><div class="col-md-2">Count</div><div class="col-md-3">Cost per day (INR)</div>
      </div>
      <div id="resList"></div>
      <button type="button" class="btn btn-outline-secondary btn-sm" data-add="res">Add resource</button>
    </div>

    <div class="col-md-6"><label class="form-label" for="deliverables">Deliverables (optional, one per line)</label>
      <textarea class="form-control" id="deliverables" name="deliverables" rows="4" placeholder="Design mockups&#10;Working website"></textarea></div>
    <div class="col-md-6"><label class="form-label" for="constraints">Constraints (optional, one per line)</label>
      <textarea class="form-control" id="constraints" name="constraints" rows="4" placeholder="No work on weekends&#10;Launch before the festival season"></textarea></div>

    <div class="col-12">
      <h2 class="h5 mt-2">Past projects (optional)</h2>
      <div id="pastList"></div>
      <button type="button" class="btn btn-outline-secondary btn-sm" data-add="past">Add past project</button>
    </div>
  </div>
  <button id="submitBtn" class="btn btn-main btn-lg mt-4" type="submit">Build plan and analyze risks</button>
</fieldset>
</form>

<div id="progress" class="panel mt-3" hidden aria-live="polite">
  <div class="d-flex align-items-center gap-2">
    <div class="spinner-border spinner-border-sm" aria-hidden="true"></div>
    <span id="stepText">Starting...</span>
    <span class="ms-auto text-secondary" id="elapsed">0s</span>
  </div>
  <div class="progress mt-2" style="height:6px"><div id="bar" class="progress-bar bg-success" style="width:5%"></div></div>
  <p class="small text-secondary mb-0 mt-2">Each step can take 10 to 40 seconds. Keep this page open.</p>
</div>

<template id="resTpl">
  <div class="row g-2 mb-2 row-item">
    <div class="col-md-5"><input class="form-control" name="role" placeholder="Role (for example Designer)" aria-label="Role"></div>
    <div class="col-4 col-md-2"><input type="number" min="1" class="form-control" name="count" value="1" aria-label="Count"></div>
    <div class="col-5 col-md-3"><input type="number" min="0" class="form-control" name="costPerDay" placeholder="Cost per day" aria-label="Cost per day"></div>
    <div class="col-3 col-md-2"><button type="button" class="btn btn-outline-secondary w-100" data-remove>Remove</button></div>
  </div>
</template>

<template id="pastTpl">
  <div class="row g-2 mb-2 row-item">
    <div class="col-md-3"><input class="form-control" name="pname" placeholder="Project name" aria-label="Past project name"></div>
    <div class="col-6 col-md-2"><input type="number" min="0" class="form-control" name="pplancost" placeholder="Planned cost" aria-label="Planned cost"></div>
    <div class="col-6 col-md-2"><input type="number" min="0" class="form-control" name="pactcost" placeholder="Actual cost" aria-label="Actual cost"></div>
    <div class="col-6 col-md-1"><input type="number" min="1" class="form-control" name="pplandays" placeholder="Plan days" aria-label="Planned days"></div>
    <div class="col-6 col-md-1"><input type="number" min="1" class="form-control" name="pactdays" placeholder="Actual days" aria-label="Actual days"></div>
    <div class="col-8 col-md-2"><select class="form-select" name="poutcome" aria-label="Outcome">
      <option>Success</option><option>Over budget</option><option>Delayed</option><option>Cancelled</option></select></div>
    <div class="col-4 col-md-1"><button type="button" class="btn btn-outline-secondary w-100" data-remove aria-label="Remove past project">&times;</button></div>
  </div>
</template>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/index.js"></script>
</body>
</html>
